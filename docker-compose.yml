version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: freelance_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: freelance_redis
    ports:
      - "6379:6379"
    restart: unless-stopped